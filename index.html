<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Proxy</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div id="toolbar">

        <button id="back">
            ←
        </button>

        <button id="forward">
            →
        </button>

        <button id="refresh">
            ↻
        </button>

        <input
            id="urlBar"
            type="text"
            placeholder="Enter URL"
            autocomplete="off"
        >

        <button id="go">
            Go
        </button>

    </div>

    <div id="view"></div>

    <script src="app.js"></script>

</body>
</html>
